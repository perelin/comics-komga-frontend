# Lightweight deploy: official Caddy image serving the prebuilt static SPA +
# proxying /komga to Komga. No custom image / registry — `dist/` and the
# Caddyfile are mounted from this directory. Build `dist/` locally and ship it
# here (see DEPLOY.md). Lives at /opt/apps/comics/ on CT 101 (Docker host).
services:
  comics:
    image: caddy:2-alpine
    container_name: comics
    restart: unless-stopped
    ports:
      - "8091:80" # edge Caddy (CT 100) proxies comics.p2lab.com → 10.10.10.10:8091
    env_file: .env # KOMGA_API_KEY (from `pass services/komga/api-key`)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist:/srv:ro
    networks:
      - shared
    labels:
      - portal.enable=true
      - portal.name=comics
      - portal.icon=📚
      - portal.url=https://comics.p2lab.com
      - portal.description=Komga power frontend

networks:
  shared:
    external: true
