<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex">
	<title>Sign in · Komga Power Frontend</title>
	<style>
		:root { color-scheme: dark; }
		* { box-sizing: border-box; margin: 0; }
		body {
			min-height: 100vh;
			display: grid;
			place-items: center;
			padding: 1.5rem;
			background: #09090b;
			color: #fafafa;
			font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
			-webkit-font-smoothing: antialiased;
		}
		form {
			width: min(20rem, 100%);
			padding: 2rem;
			background: #18181b;
			border: 1px solid #27272a;
			border-radius: 0.75rem;
			display: grid;
			gap: 1rem;
		}
		h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.01em; }
		p { font-size: 0.8rem; color: #a1a1aa; }
		input[type="password"] {
			width: 100%;
			padding: 0.6rem 0.75rem;
			background: #09090b;
			border: 1px solid #3f3f46;
			border-radius: 0.5rem;
			color: #fafafa;
			font: inherit;
		}
		input[type="password"]:focus {
			outline: 2px solid #d4d4d8;
			outline-offset: 1px;
		}
		button {
			padding: 0.6rem;
			background: #fafafa;
			color: #18181b;
			border: 0;
			border-radius: 0.5rem;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
		button:hover { background: #e4e4e7; }
		.error { color: #f87171; }
	</style>
</head>
<body>
	<form method="post" action="/login">
		<h1>Komga Power Frontend</h1>
		<p>This instance is private. Enter its password to continue.</p>
		{{if .Error}}<p class="error">Wrong password — try again.</p>{{end}}
		<input type="password" name="password" placeholder="Password" required autofocus autocomplete="current-password" aria-label="Password">
		<input type="hidden" name="next" value="{{.Next}}">
		<button type="submit">Sign in</button>
	</form>
</body>
</html>
